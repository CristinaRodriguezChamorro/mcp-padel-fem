version: '3.9'

services:
  mcp-server:
    build: ./apps/mcp-server
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SCRAPER_CONTACT=${SCRAPER_CONTACT}
      - MCP_TOKEN=${MCP_TOKEN}
      - MCP_RATE_PER_MIN=${MCP_RATE_PER_MIN}
      - NEWS_RSS_ENABLED=${NEWS_RSS_ENABLED}
      - PLAYER_PHOTOS=${PLAYER_PHOTOS}
      - MCP_AUTH=${MCP_AUTH}
      - MCP_GITHUB_USERS=${MCP_GITHUB_USERS}
      - WIKIPEDIA_INGEST=${WIKIPEDIA_INGEST}
      - PADELAPI_TOKEN=${PADELAPI_TOKEN}
      - PADELAPI_INGEST=${PADELAPI_INGEST}
      - MCP_TOOLS=${MCP_TOOLS}
      - WIKIPEDIA_INGEST_HOURS=${WIKIPEDIA_INGEST_HOURS}
